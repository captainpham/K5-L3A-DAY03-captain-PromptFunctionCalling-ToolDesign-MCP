# starter_v0 — tool declarations (intentionally vague).
# Names and descriptions here are a rough first draft. Routing rules, name->handle
# mapping, arg conventions (news/timeframe/Top), and the send-confirmation boundary
# are NOT spelled out anywhere yet. Your job is to make these declarations + the
# system prompt good enough that the agent routes correctly on the eval.
#
# If you rename a tool, keep the name in sync across:
#   this file  ->  tools/__init__.py (TOOL_FUNCTIONS)  ->  data/eval_base.json + data/eval_research_extension.json
# `pytest tests/test_tool_contract.py` checks this sync for you.
#
# TODO(student):
#   - Rewrite every description: what it does, WHEN to use it, WHEN NOT to use it.
#   - Spell out arg conventions in parameter descriptions (handle format, topic/timeframe, search_type).
#   - Make the `send` confirmation boundary explicit.
#   - Declare your new tool(s) at the end of this file.
tools:
  - name: deduplicate
    description: "Loại bài trùng URL trong danh sách item đã có, giữ item đầu tiên và thứ tự. Dùng khi người dùng muốn gộp nguồn hoặc bỏ link trùng trước khi làm bản tin. Không dùng để tìm kiếm, đọc URL hoặc so sánh nội dung bài. Chỉ so URL sau khi bỏ khoảng trắng hai đầu; item thiếu URL vẫn được giữ riêng và có warnings kèm vị trí item trong input."
    parameters:
      type: object
      properties:
        items:
          type: array
          description: "Danh sách item đã được cung cấp hoặc thu thập; không tự tạo item."
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
      required: [items]
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Gửi một câu hỏi cho người dùng."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Kiểu trả lời"}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn"}
      required: [question]

  - name: timeline
    description: "Lấy các bài đăng gần đây."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Tên tài khoản"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [screenname]

  - name: social_search
    description: "Tìm trên mạng xã hội."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Cách sắp xếp"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [query]

  - name: lookup
    description: "Tra cứu thông tin trên internet."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        topic: {type: string, enum: [general, news], default: "general", description: "Phân loại"}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "Khoảng thời gian"}
        max_results: {type: integer, default: 5, description: "Số kết quả"}
      required: [query]

  - name: fetch
    description: "Lấy nội dung từ một địa chỉ."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "Địa chỉ"}
      required: [url]

  - name: format
    description: "Trình bày dữ liệu đã có thành văn bản."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Khuôn"}
        headline: {type: string, default: "", description: "Tiêu đề"}
      required: [items, template]

  # ---------------- Bonus tools ----------------
  - name: send
    description: "Gửi một đoạn văn bản đi."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Nội dung"}
        confirmed: {type: boolean, default: false, description: "Cờ xác nhận"}
      required: [text]

  - name: policy
    description: "Tìm trong tài liệu nội bộ."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Nhóm"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: papers
    description: "Tìm bài báo khoa học."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        max_results: {type: integer, default: 5, description: "Số lượng"}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Sắp xếp"}
      required: [query]

  - name: paper_text
    description: "Lấy nội dung text của một bài báo."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "ID hoặc địa chỉ"}
        max_pages: {type: integer, default: 5, description: "Số trang"}
        max_chars: {type: integer, default: 8000, description: "Số ký tự"}
      required: [arxiv_url]

  # ---------------- Team tools (new) ----------------
  - name: hackernews
    description: "Tìm bài (story) trên Hacker News theo từ khóa. CHỈ dùng khi người dùng nhắc rõ Hacker News / HN. Không dùng cho tin tức web chung (dùng lookup) hay bài đăng Twitter/X (dùng social_search)."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa chủ đề, ví dụ 'AI agents'. Không kèm chữ 'Hacker News'."}
        sort: {type: string, enum: [relevance, date], default: "relevance", description: "relevance = khớp nhất / nổi bật (mặc định); date = mới nhất trước, dùng khi người dùng nói 'mới nhất', 'gần đây'."}
        limit: {type: integer, default: 5, description: "Số bài cần lấy (1-20). Lấy đúng con số người dùng nêu."}
      required: [query]

  - name: wikipedia
    description: "Tra định nghĩa / kiến thức nền về một khái niệm, người, tổ chức trên Wikipedia. CHỈ dùng khi người dùng nhắc rõ Wikipedia / wiki. Không dùng cho tin tức mới hay sự kiện đang diễn ra (dùng lookup)."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Tên khái niệm cần tra, ví dụ 'Transformer (deep learning)'."}
        lang: {type: string, enum: [vi, en], default: "vi", description: "Ngôn ngữ Wikipedia: vi (mặc định) hoặc en khi người dùng yêu cầu bản tiếng Anh."}
        limit: {type: integer, default: 1, description: "Số bài viết trả về (1-5)."}
      required: [query]

  - name: github_repos
    description: "Tìm repository mã nguồn công khai trên GitHub theo từ khóa. CHỈ dùng khi người dùng muốn tìm repo / thư viện / project mã nguồn trên GitHub. Không dùng để đọc một URL cụ thể (dùng fetch) hay tìm bài báo khoa học (dùng papers)."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa tìm repo, ví dụ 'llm agent framework'."}
        sort: {type: string, enum: [stars, updated], default: "stars", description: "stars = nhiều sao nhất (mặc định, dùng cho 'phổ biến', 'nổi bật'); updated = cập nhật gần đây nhất."}
        limit: {type: integer, default: 5, description: "Số repo cần lấy (1-20). Lấy đúng con số người dùng nêu."}
      required: [query]

  - name: save_note
    description: "Lưu một đoạn văn bản (bản tin, ghi chú) thành file markdown TRÊN MÁY, trong thư mục notes/. CHỈ dùng khi người dùng yêu cầu lưu / ghi lại thành file hoặc ghi chú VÀ nội dung cần lưu đã có trong hội thoại. Không gửi đi đâu cả: muốn đăng / gửi lên Telegram thì dùng send. Nếu chưa có nội dung để lưu thì hỏi lại bằng clarify, không tự bịa nội dung."
    parameters:
      type: object
      properties:
        content: {type: string, default: "", description: "Toàn bộ nội dung markdown cần lưu, lấy nguyên văn từ hội thoại."}
        title: {type: string, default: "", description: "Tiêu đề ngắn của ghi chú, dùng để đặt tên file."}
      required: [content]
